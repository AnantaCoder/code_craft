services:
  # Auxiliary service to build and register the sandbox compilation image
  # This makes the "code_craft_sandbox" image available in the host's Docker registry
  sandbox:
    build:
      context: ./backend
      dockerfile: sandbox.dockerfile
    image: code_craft_sandbox
    entrypoint: ["echo", "Sandbox image 'code_craft_sandbox' built successfully!"]

  # Backend service (FastAPI Application)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SANDBOX_MODE=docker
      - TMPDIR=/tmp/code_craft
      - DOCKER_VOLUME_NAME=code_craft_temp
    volumes:
      # Mount the Docker socket so the backend can execute sibling sandbox containers on the host
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the shared named volume so both backend and sandbox containers see the same temp files at identical paths
      - code_craft_temp:/tmp/code_craft
    depends_on:
      - sandbox

  # Frontend service (Bun React Web Application)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BUN_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  # Define the named volume with an explicit global name to avoid project-name prefixing
  code_craft_temp:
    name: code_craft_temp
